{% extends "base.html" %}
{% block title %}Online Shop: SignUp{% endblock title %}

{% block content %}
<div class="container d-flex justify-content-center align-items-start" style="margin-top: 100px; margin-bottom: 100px;">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px; border-radius: 15px;" data-aos="fade-up">
        <h3 class="text-center mb-4" data-aos="fade-up" data-aos-delay="100">SignUp</h3>

        <!-- Form Section -->
        <form method="post" class="row g-3 mt-3" id="signupForm" data-aos="fade-up" data-aos-delay="200">
            {% csrf_token %}
            
            <!-- Email Field -->
            <div class="col-12">
                <label for="email" class="form-label" style="font-weight: 500; color: #4a5568;">Email</label>
                <input type="email" 
                       class="form-control {% if form.email.errors %}is-invalid{% endif %}" 
                       id="email" 
                       name="email" 
                       placeholder="Enter your email" 
                       required
                       style="border-radius: 10px; padding: 10px; border: 1px solid #e2e8f0;">
            </div>

            <!-- Password Field -->
            <div class="col-12">
                <label for="password" class="form-label" style="font-weight: 500; color: #4a5568;">Password</label>
                <input type="password" 
                       class="form-control {% if form.password.errors %}is-invalid{% endif %}" 
                       id="password" 
                       name="password" 
                       placeholder="Enter your password" 
                       required
                       style="border-radius: 10px; padding: 10px; border: 1px solid #e2e8f0;">
            </div>

            <!-- Confirm Password Field -->
            <div class="col-12">
                <label for="confirm_password" class="form-label" style="font-weight: 500; color: #4a5568;">Confirm Password</label>
                <input type="password" 
                       class="form-control {% if form.confirm_password.errors %}is-invalid{% endif %}" 
                       id="confirm_password" 
                       name="confirm_password" 
                       placeholder="Confirm your password" 
                       required
                       style="border-radius: 10px; padding: 10px; border: 1px solid #e2e8f0;">
            </div>

            <!-- Submit and Reset Buttons -->
            <div class="col-12 d-flex gap-2 justify-content-center mt-4" data-aos="fade-up" data-aos-delay="300">
                <button type="submit" class="btn btn-primary col-5" style="border-radius: 10px; padding: 10px; font-weight: 500; background-color: #ff6600; border: none;">Submit</button>
                <button type="reset" class="btn btn-danger col-5" style="border-radius: 10px; padding: 10px; font-weight: 500; background-color: #dc3545; border: none;">Clear</button>
            </div>
        </form>

        <!-- Login Link -->
        <div class="text-center mt-4" data-aos="fade-up" data-aos-delay="400">
            <a href="{% url 'login' %}" style="text-decoration: none; color: #ff6600;">Already have an account? Login</a>
        </div>
    </div>
</div>

<!-- Modal for Error Messages -->
<div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="errorModalLabel">Error</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="errorMessage"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<style>
    /* Custom Styles for the SignUp Page */
    .card {
        background-color: #ffffff;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .form-control:focus {
        border-color: #ff6600;
        box-shadow: 0 0 5px rgba(255, 102, 0, 0.5);
    }

    .btn-primary {
        background-color: #ff6600;
        border: none;
        transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #e65c00;
    }

    .btn-danger {
        background-color: #dc3545;
        border: none;
        transition: background-color 0.3s ease;
    }

    .btn-danger:hover {
        background-color: #c82333;
    }

    a {
        color: #ff6600;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }
</style>

<script>
    // Check for error messages and display modal
    document.addEventListener('DOMContentLoaded', function() {
        {% if messages %}
            var errorMessage = "";
            {% for message in messages %}
                errorMessage += "{{ message }}<br>";
            {% endfor %}
            document.getElementById('errorMessage').innerHTML = errorMessage;
            var modal = new bootstrap.Modal(document.getElementById('errorModal'));
            modal.show();
        {% endif %}
    });
</script>
{% endblock %}

{% block scripts %}
<!-- AOS CSS -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">

<!-- AOS JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>

<!-- Initialize AOS -->
<script>
    AOS.init({
        duration: 1000, // Animation duration
        once: true, // Whether animation should happen only once - while scrolling down
    });
</script>
{% endblock %}
