{% extends "base.html" %}
{% block title %}Login{% endblock title %}

{% block content %}
<div class="container-fluid" style="margin-top: 100px; margin-bottom: 100px;">
    <div class="row justify-content-center">
        <div class="col-md-5"> <!-- Adjusted width for better alignment -->
            <div class="card p-4 shadow-sm border-0" style="border-radius: 15px;" data-aos="fade-up">
                <!-- Welcome Message -->
                <h2 class="text-center mb-4" style="font-weight: bold; color: #2b3a42;" data-aos="fade-up" data-aos-delay="100">Welcome Back</h2>

                <!-- Form Section -->
                <form method="post" class="row g-3 mt-2" id="loginForm" data-aos="fade-up" data-aos-delay="200">
                    {% csrf_token %}

                    <!-- Email Field -->
                    <div class="col-12">
                        <label for="email" class="form-label" style="font-weight: 500; color: #4a5568;">Email</label>
                        <input type="email" 
                               class="form-control {% if form.email.errors %}is-invalid{% endif %}" 
                               id="email" 
                               name="email" 
                               placeholder="Enter your email" 
                               required
                               style="border-radius: 10px; padding: 10px; border: 1px solid #e2e8f0;">
                    </div>

                    <!-- Password Field -->
                    <div class="col-12">
                        <label for="password" class="form-label" style="font-weight: 500; color: #4a5568;">Password</label>
                        <input type="password" 
                               class="form-control {% if form.password.errors %}is-invalid{% endif %}" 
                               id="password" 
                               name="password" 
                               placeholder="Enter your password" 
                               required
                               style="border-radius: 10px; padding: 10px; border: 1px solid #e2e8f0;">
                    </div>

                    <!-- Forgot Password Link -->
                    <div class="col-12 text-end" data-aos="fade-up" data-aos-delay="250">
                        <a href="{% url 'forgot_password' %}" style="text-decoration: none; color: #ff6600;">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <div class="col-12 d-flex justify-content-center mt-4">
                        <button type="submit" class="btn btn-primary w-100" style="border-radius: 10px; padding: 10px; font-weight: 500; background-color: #ff6600; border: none;">
                            Login
                        </button>
                    </div>
                </form>

                <!-- Sign Up Link -->
                <div class="text-center mt-4" data-aos="fade-up" data-aos-delay="300">
                    <p style="color: #718096;">Don't have an account? <a href="{% url 'signup' %}" style="text-decoration: none; color: #ff6600;">Sign up here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Custom Styles for the Login Page */
    .card {
        background-color: #ffffff;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .form-control:focus {
        border-color: #ff6600;
        box-shadow: 0 0 5px rgba(255, 102, 0, 0.5);
    }

    .btn-primary {
        background-color: #ff6600;
        border: none;
        transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #e65c00;
    }

    a {
        color: #ff6600;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block scripts %}
<!-- AOS CSS -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">

<!-- AOS JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>

<!-- Initialize AOS -->
<script>
    AOS.init({
        duration: 1000, // Animation duration
        once: true, // Whether animation should happen only once - while scrolling down
    });
</script>
{% endblock %}
