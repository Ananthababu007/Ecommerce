<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- AOS CSS -->
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }

        /* Sidebar Styles */
        .sidebar {
            height: 100vh;
            position: fixed;
            width: 250px;
            background-color: #ffffff; /* White background */
            padding-top: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar h4 {
            color: #2c3e50; /* Dark blue-gray for text */
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .sidebar a {
            padding: 15px 20px;
            text-decoration: none;
            font-size: 16px;
            color: #2c3e50; /* Dark blue-gray for text */
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            border-bottom: 1px solid #e0e0e0; /* Line between navigation items */
        }

        .sidebar a i {
            margin-right: 10px;
            font-size: 18px;
            color: #2c3e50; /* Dark blue-gray for icons */
        }

        .sidebar a:hover {
            background-color: #fff3e0; /* Light orange background on hover */
            color: #ff6600; /* Orange text on hover */
        }

        .sidebar a:hover i {
            color: #ff6600; /* Orange icons on hover */
        }

        .sidebar a.active {
            background-color: #fff3e0; /* Light orange background for active link */
            color: #ff6600; /* Orange text for active link */
            border-left: 4px solid #ff6600; /* Orange accent border */
        }

        .sidebar a.active i {
            color: #ff6600; /* Orange icons for active link */
        }

        /* Main Content Area */
        .content {
            margin-left: 250px;
            padding: 20px;
            background-color: #ffffff;
            min-height: 100vh;
        }

        .dashboard-header {
            margin-top: 20px;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
        }

        /* AOS Animations */
        [data-aos] {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" data-aos="fade-right" data-aos-duration="1000">
    <h4>Admin Dashboard</h4>
    <a href="{% url 'admin_dashboard' %}" class="active"><i class="fas fa-chart-line"></i> Dashboard Overview</a>
    <a href="{% url 'admin_products' %}"><i class="fas fa-box"></i> Products</a>
    <a href="{% url 'sales' %}"><i class="fas fa-chart-pie"></i> Sales</a>
    <a href="{% url 'admin_customers' %}"><i class="fas fa-user-cog"></i> Customers</a>
    <a href="{% url 'category_list' %}"><i class="fas fa-tags"></i> Categories</a>
    <a href="{% url 'supplier_list' %}"><i class="fas fa-truck"></i> Suppliers</a>
    <a href="{% url 'payment_details' %}"><i class="fas fa-money-check-alt"></i> Payments</a>
    <a href="{% url 'advertisement_management' %}"><i class="fas fa-bullhorn"></i> Manage Advertisements</a>
    <a href="{% url 'logout' %}"><i class="fas fa-sign-out-alt"></i> Logout</a>
</div>

<!-- Main Content Area -->
<div class="content">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<!-- AOS JS -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
    // Initialize AOS
    AOS.init({
        once: true, // Animations will only happen once
    });

    // Add active class to the current link
    const currentUrl = window.location.pathname;
    const sidebarLinks = document.querySelectorAll('.sidebar a');
    sidebarLinks.forEach(link => {
        if (link.getAttribute('href') === currentUrl) {
            link.classList.add('active');
        }
    });
</script>
</body>
</html>
